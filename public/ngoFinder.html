<!DOCTYPE html>
<html lang="en" ng-app="myModule">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NGO Finder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

<style>

body{
    background:#f4f6f9;
}

.navbar{
    background:#198754;
}

.navbar-brand{
    color:white !important;
    font-size:32px;
    font-weight:bold;
}

.search-box{

    background:white;
    border-radius:12px;
    padding:25px;
    margin-top:35px;
    box-shadow:0 0 15px rgba(0,0,0,.15);

}

.table{

    background:white;

}

</style>

 <script>
    $(document).ready(function(){

    if(localStorage.getItem("activeUser")==null)
    {
        window.location.replace("index.html");
        return;
    }

    $("#welcomeUser").html(localStorage.getItem("activeUser"));

    // Agar email field hai to usme bhi set kar do
    $("#txtEmail").val(localStorage.getItem("activeUser"));
    $("#emailid").val(localStorage.getItem("activeUser"));

});
</script>

<script>

var app=angular.module("myModule",[]);

app.controller("myController",function($scope,$http){

//------------------Fill Cities----------------------

$scope.fetchCities=function(){

    $http.get("/fetch-ngo-cities").then(function(response){

        $scope.cities=response.data;

    });

}

//------------------Find NGOs----------------------

$scope.findNgo=function(){

    var city=$scope.selCity || "";

    $http.get("/find-ngos?city="+city).then(function(response){

        $scope.ngos=response.data;

        if(response.data.length==0)
            alert("No NGO Found");

    });

}

});

</script>

</head>

<body ng-controller="myController" ng-init="fetchCities()">

<nav class="navbar">

<div class="container">

<a class="navbar-brand">NGO Finder</a>

</div>

</nav>

<div class="container">

<div class="search-box">

<div class="row align-items-end">

<div class="col-md-5">

<label class="form-label fw-bold">

City

</label>

<input class="form-control"
list="cityList"
placeholder="Type or Select City"
ng-model="selCity">

<datalist id="cityList">

<option ng-repeat="obj in cities"
value="{{obj.city}}">

</option>

</datalist>

</div>

<div class="col-md-3">

<button class="btn btn-success w-100"
ng-click="findNgo()">

Find NGOs

</button>

</div>

</div>

</div>

<br><br>

<table class="table table-bordered table-hover">

<thead class="table-success">

<tr>

<th>Sr.No.</th>

<th>NGO</th>

<th>Registration Office</th>

<th>City</th>

<th>Website</th>

<th>Contact</th>

<th>Since</th>

<th>Chair Person</th>

<th>Works</th>

</tr>

</thead>

<tbody>

<tr ng-repeat="obj in ngos">

<td>{{$index+1}}</td>

<td>{{obj.ngo}}</td>

<td>{{obj.regoffice}}</td>

<td>{{obj.city}}</td>

<td>{{obj.website}}</td>

<td>{{obj.contactno}}</td>

<td>{{obj.since}}</td>

<td>{{obj.chairperson}}</td>

<td>{{obj.ngoworks}}</td>

</tr>

</tbody>

</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
