<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            background:#f8f9fa;
        }

        .main-box{
            border:2px solid #0d6efd;
            margin-top:30px;
        }

        .header{
            background:#0d6efd;
            color:white;
            padding:10px;
            font-size:22px;
            text-align:center;
            font-weight:bold;
        }

        .upload-box{
            margin-top: 30px;
            width:280px;
            padding:20px;
            text-align:center;
            background:#fff;
            border:none;
        }

        .upload-box img{
            width:150px;
            height:180px;
            border:1px solid #999;
            object-fit:cover;
        }

        .btn-register{
            width:250px;
        }

        h3{
            text-align:center;
            margin-bottom:25px;
        }
    </style>

     <script>
    $(document).ready(function(){

    if(localStorage.getItem("activeUser")==null)
    {
        window.location.replace("index.html");
        return;
    }

    $("#welcomeUser").html(localStorage.getItem("activeUser"));

    // Agar email field hai to usme bhi set kar do
    $("#txtEmail").val(localStorage.getItem("activeUser"));
    $("#emailid").val(localStorage.getItem("activeUser"));

});
</script>

    <script>
        function showPreview(file,prev)
        {
            if(file.files && file.files[0])
            {
                prev.src=URL.createObjectURL(file.files[0]);
            }
        }
    </script>
    <script>

$(document).ready(function(){

    $("#emailid").val(localStorage.getItem("activeUser"));

    //-----------------------------------------
    // Fetch NGO Details
    //-----------------------------------------

    $("#btnFetch").click(function(){

        alert($("#emailid").val());

        let obj={

            url:"/ngo-fetch",

            data:{
                emailid:$("#emailid").val()
            }

        };

        $.ajax(obj).then(function(jsonAry){

            if(jsonAry.length==0)
            {
                alert("No Record Found");
                return;
            }

            $("#ngo").val(jsonAry[0].ngo);
            $("#regoffice").val(jsonAry[0].regoffice);
            $("#city").val(jsonAry[0].city);
            $("#website").val(jsonAry[0].website);
            $("#contactno").val(jsonAry[0].contactno);
            $("#since").val(jsonAry[0].since);
            $("#chairperson").val(jsonAry[0].chairperson);
            $("#ngoworks").val(jsonAry[0].ngoworks);
            $("#regnumber").val(jsonAry[0].regnumber);

            $("#prevPic").prop("src",jsonAry[0].picurl);

            $("#hdnPic").val(jsonAry[0].picurl);

        }).fail(function(err){

            alert(err.responseText);

        });

    });

});

</script>

</head>

<body>

<div class="container">

<div class="main-box">

<div class="header">
    NGO Registration
</div>

<div class="container py-4">

<h3>NGO Registration</h3>

<form action="/ngo-process" method="post" enctype="multipart/form-data">
    <input type="hidden" name="hdnPic" id="hdnPic">

<div class="row">

    <!-- Left Side -->

    <div class="col-md-3">

        <div class="upload-box">

            <img id="prevPic" width="150" height="180">

            <br><br>

            <input type="file"
                   class="form-control"
                   name="pic"
                   id="pic"
                   onchange="showPreview(this,prevPic)">

            <br>

        </div>

    </div>

    <!-- Right Side -->

    <div class="col-md-9">

        <div class="row mb-3">

            <div class="col-md-5">

    <label>Email Id</label>

    <input type="email"
           class="form-control"
           name="emailid"
           id="emailid" readonly>

</div>

<div class="col-md-2">

    <label>&nbsp;</label>

    <button type="button"
            class="btn btn-success form-control"
            id="btnFetch">

        Fetch

    </button>

</div>

        </div>

        <div class="row mb-3">

            <div class="col-md-4">

                <label>NGO Name</label>

                <input type="text"
                       class="form-control"
                       name="ngo"
                       id="ngo">

            </div>

            <div class="col-md-4">

                <label>Reg. Office</label>

                <input type="text"
                       class="form-control"
                       name="regoffice"
                       id="regoffice">

            </div>

            <div class="col-md-4">

                <label>City</label>

                <input type="text"
                       class="form-control"
                       name="city"
                       id="city">

            </div>

        </div>

        <div class="row mb-3">

            <div class="col-md-5">

                <label>Website</label>

                <input type="text"
                       class="form-control"
                       name="website"
                       id="website">

            </div>

            <div class="col-md-3">

                <label>Contact Number</label>

                <input type="text"
                       class="form-control"
                       name="contactno"
                       id="contactno">

            </div>

            <div class="col-md-4">

                <label>Since</label>

                <input type="date"
                       class="form-control"
                       name="since"
                       id="since">

            </div>

        </div>

        <div class="row mb-3">

            <div class="col-md-4">

                <label>Chair Person</label>

                <input type="text"
                       class="form-control"
                       name="chairperson"
                       id="chairperson">

            </div>

            <div class="col-md-6">

                <label>NGO Profile / Works</label>

                <input type="text"
                       class="form-control"
                       name="ngoworks"
                       id="ngoworks">

            </div>

        </div>

        <div class="row mb-4">

            <div class="col-md-6">

                <label>Registration Number</label>

                <input type="text"
                       class="form-control"
                       name="regnumber"
                       id="regnumber">

            </div>

        </div>

        <div class="text-center">

            <div class="text-center">

    <button type="submit"
            class="btn btn-primary"
            formaction="/ngo-process">

        Register

    </button>

    &nbsp;&nbsp;

    <button type="submit"
            class="btn btn-primary"
            formaction="/ngo-update">

        Update

    </button>

</div>

        </div>

    </div>

</div>

</form>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
