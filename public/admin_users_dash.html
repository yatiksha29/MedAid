<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin User Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

     <script>
    $(document).ready(function(){

    if(localStorage.getItem("activeUser")==null)
    {
        window.location.replace("index.html");
        return;
    }

    $("#welcomeUser").html(localStorage.getItem("activeUser"));

    // Agar email field hai to usme bhi set kar do
    $("#txtEmail").val(localStorage.getItem("activeUser"));
    $("#emailid").val(localStorage.getItem("activeUser"));

});
</script>

    <script>

        let myModule = angular.module("myModule", []);

        let myController = myModule.controller("myController", function ($scope, $http) {

            $scope.users = [];

            //---------------------------------------------

            $scope.doFetchUsers = function () {

                let url = "/fetch-all-users";

                $http.get(url).then(function (resp) {

                    $scope.users = resp.data;

                }, function (err) {

                    alert(err.data);

                });

            }

            //---------------------------------------------

            $scope.doBlock = function (email) {

                if (!confirm("Block this user?"))
                    return;

                let url = "/block-user?emailidKuch=" + email;

                $http.get(url).then(function (resp) {

                    alert(resp.data);

                    $scope.doFetchUsers();

                }, function (err) {

                    alert(err.data);

                });

            }

            //---------------------------------------------

            $scope.doResume = function (email) {

                if (!confirm("Resume this user?"))
                    return;

                let url = "/resume-user?emailidKuch=" + email;

                $http.get(url).then(function (resp) {

                    alert(resp.data);

                    $scope.doFetchUsers();

                }, function (err) {

                    alert(err.data);

                });

            }

            //------------------------------------------------
            $scope.doDelete=function(email)
{
    if(confirm("Are you sure you want to delete this user?"))
    {
        let url="/delete-user?emailidKuch="+email;

        $http.get(url).then(function(resp){

            alert(resp.data);

            $scope.doFetchUsers();

        },function(err){

            alert(err.data);

        });
    }
}

        });

    </script>

</head>

<body ng-app="myModule" ng-controller="myController">

    <div class="container mt-4">

        <div class="row">

            <div class="col-md-12 bg-warning text-dark rounded p-3">

                <h2 class="text-center">
                    Admin User Dashboard
                </h2>

            </div>

        </div>

        <div class="row mt-4">

            <div class="col-md-12 text-center">

                <button class="btn btn-primary btn-lg"
                    ng-click="doFetchUsers()"
                    data-bs-toggle="modal"
                    data-bs-target="#userModal">

                    Fetch Users

                </button>

            </div>

        </div>

    </div>





    <!-- Modal -->

    <div class="modal fade"
        id="userModal"
        tabindex="-1">

        <div class="modal-dialog modal-xl">

            <div class="modal-content">

                <div class="modal-header bg-primary text-white">

                    <h4 class="modal-title">

                        Registered Users

                    </h4>

                    <button class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="table-responsive">
                        <table class="table table-bordered table-hover table-striped align-middle">

                            <thead class="table-dark">
                        
                                <tr>
                        
                                    <th>Sr.No.</th>
                                    <th>Email ID</th>
                                    <th>Password</th>
                                    <th>User Type</th>
                                    <th>Date of Signup</th>
                                    <th>Status</th>
                                    <th width="280">Operations</th>
                        
                                </tr>
                        
                            </thead>
                        
                            <tbody>
                        
                                <tr ng-repeat="obj in users">
                        
                                    <td>{{$index+1}}</td>
                        
                                    <td>{{obj.emailid}}</td>
                        
                                    <td>{{obj.pwd}}</td>
                        
                                    <td>{{obj.utype}}</td>
                        
                                    <td>{{obj.dos}}</td>
                        
                                    <td>
                        
                                        <span class="badge bg-success"
                                              ng-show="obj.active==1">
                        
                                            Active
                        
                                        </span>
                        
                                        <span class="badge bg-danger"
                                              ng-show="obj.active==0">
                        
                                            Blocked
                        
                                        </span>
                        
                                    </td>
                        
                                    <td>
                        
                                        <button
                                            class="btn btn-warning btn-sm"
                                            ng-show="obj.active==1"
                                            ng-click="doBlock(obj.emailid)">
                        
                                            Block
                        
                                        </button>
                        
                                        <button
                                            class="btn btn-success btn-sm"
                                            ng-show="obj.active==0"
                                            ng-click="doResume(obj.emailid)">
                        
                                            Resume
                        
                                        </button>
                        
                                        <button
                                            class="btn btn-danger btn-sm ms-1"
                                            ng-click="doDelete(obj.emailid)">
                        
                                            Delete
                        
                                        </button>
                        
                                    </td>
                        
                                </tr>
                        
                            </tbody>
                        
                        </table>

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Close

                    </button>

                </div>

            </div>

        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
