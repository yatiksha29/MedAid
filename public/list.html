<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO List</title>
</head>
<script>
    let count=2;
    function doAdd()
    {
        let newtxt=document.createElement("input");
        newtxt.type="text";
        newtxt.id="txt"+count;
        document.getElementById("con").appendChild(newtxt);
        document.getElementById("con").appendChild(document.createElement("br"));
        count++;
    }

    function doSum()
    {
        let all="";
        for(let i=1;i<count;i++)
        {
            all+=document.getElementById("txt" + i).value+",";
        }
        document.getElementById("result").innerHTML=all;
    }
</script>
<body>
    <center>
        <div style="border: black solid 2px; width: 300px; height: 300px; background: pink;" id="con">
            <input type="text" id="txt1">
        </div>
        <div>
            <input type="button" value="add" onclick="doAdd()">
            <input type="button" value="show" onclick="doSum()">
            <br>
            <span id="result">*</span>
        </div>
    </center>
</body>
</html>
