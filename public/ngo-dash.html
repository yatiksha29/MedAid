<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AngularJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <style>
        body{
            background:#f8f9fa;
        }

        .dashboard{
            margin-top:40px;
        }

        .card{
            height:220px;
            border-radius:12px;
            transition:0.3s;
            box-shadow:0 2px 8px rgba(0,0,0,0.15);
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        .card img{
            width:80px;
            height:80px;
            margin:25px auto 10px;
        }

        .card-body{
            display:flex;
            justify-content:center;
            align-items:flex-end;
        }

        .btn{
            width:180px;
        }
    </style>

</head>
<script>
$(document).ready(function(){

    if(localStorage.getItem("activeUser")==null)
    {
        window.location.replace("index.html");
        return;
    }

    $("#welcomeUser").html(localStorage.getItem("activeUser"));

    $("#btnLogout").click(function(){

        localStorage.clear();

        window.location.replace("index.html");

    });

});
</script>

<Script>
    $(document).ready(function()
    {
        $("#welcomeUser").html(localStorage.getItem("activeUser"));
        $("#emailid").val(localStorage.getItem("activeUser"));
    });
</Script>
<script>
    var app=angular.module("myModule", []);
    app.controller("myController", function($scope,$http){

    $scope.updatePassword = function(){
        var url="/update-password?emailid="
            + localStorage.getItem("activeUser")
            + "&oldpwd=" +$scope.oldpwd
            + "&newpwd=" +$scope.newpwd;

        $http.get(url).then(function(response){
            alert(response.data);
        });
    }

    })
</script>
<body ng-app="myModule" ng-controller="myController">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <span id="welcomeUser" style="font-size:18px;font-weight:bold;color:white;"></span>

        <a class="navbar-brand fw-bold" href="#">
            NGO Dashboard
        </a>

        <button class="btn btn-light ms-auto" id="btnLogout">
            Logout
        </button>

    </div>
</nav>


<!-- Dashboard -->

<div class="container dashboard">

    <div class="row g-4">

        <!-- Profile -->
        <div class="col-lg-3 col-md-6">
            <div class="card text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
                <div class="card-body">
                    <a href="ngo-profile.html" class="btn btn-primary">
                        Profile
                    </a>
                </div>
            </div>
        </div>

        <!-- Avail Medicine -->
        <div class="col-lg-3 col-md-6">
            <div class="card text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2966/2966489.png">
                <div class="card-body">
                    <a href="medFinder.html" class="btn btn-success">
                        Medicine Finder
                    </a>
                </div>
            </div>
        </div>

        <!-- Avail Equipment -->
        <div class="col-lg-3 col-md-6">
            <div class="card text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2785/2785482.png">
                <div class="card-body">
                    <a href="equipFinder.html" class="btn btn-warning text-dark">
                        Equipment Finder
                    </a>
                </div>
            </div>
        </div>


        <!-- Settings -->
        <div class="col-lg-3 col-md-6">
            <div class="card text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2099/2099058.png">
                <div class="card-body">
                    <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#settingsModal">
                        Settings
                    </button>
                </div>
            </div>
        </div>

        <!--------------------------- Modal for Settings ---------------------------->
        <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Settings</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Email Id</label>
                        <input type="email" class="form-control" ng--model="emailid" name="emailid" id="emailid" readonly>
                    </div>
                    <div class="mb-3">
                        <label>Existing Password</label>
                        <input type="password" class="form-control" ng--model="oldpwd">
                    </div>
                    <div class="mb-3">
                        <label>New Password</label>
                        <input type="password" class="form-control" ng--model="newpwd">
                    </div>
                    
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" ng-click="updatePassword()">Update Password</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
         </div>
    </div>
        <!--------------------------------------------------------------------------->

    </div>

</div>

</body>
</html>
